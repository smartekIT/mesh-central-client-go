name: Compile and Publish Multi-Platform Release Assets

on:
  push:
    tags:
      - 'v*' # Triggers whenever you push a tag starting with v (e.g., v1.10.1)

permissions:
  contents: write # Allows GitHub actions to upload binary assets directly to your release tab

jobs:
  build-binaries:
    name: Compile Application Ecosystem
    runs-on: ubuntu-24.04 # High-efficiency Linux runtime runner environment
    
    steps:
      - name: Checkout Source Assets
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize Native Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Configure Linux Container Backend Engine
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Extract Dynamic Workflow Versions
        id: vars
        run: |
          # Get current tag without 'v' prefix
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          CLEAN_VERSION="${TAG_NAME#v}"
          echo "VERSION=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "APP_VERSION=${CLEAN_VERSION}" >> $GITHUB_OUTPUT
          echo "COMMIT=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

      - name: Build Core Windows Installer Executables
        run: |
          cd mcc-gui/package
          podman build -t mcc-gui-build:windows -f windows.Dockerfile .
          cd ../..
          podman run --rm -v "${{ github.workspace }}:/src" -w /src \
            -e GOTOOLCHAIN=auto -e GOFLAGS=-buildvcs=false \
            -e VERSION=${{ steps.vars.outputs.VERSION }} \
            -e COMMIT=${{ steps.vars.outputs.COMMIT }} \
            -e DATE=${{ steps.vars.outputs.DATE }} \
            -e APP_VERSION=${{ steps.vars.outputs.APP_VERSION }} \
            -e APP_BUILD=${{ github.run_number }} \
            mcc-gui-build:windows sh mcc-gui/package/build.sh windows amd64 package

      - name: Build Core Linux AppImage Packages
        run: |
          cd mcc-gui/package
          podman build -t mcc-gui-build:linux -f linux.Dockerfile .
          cd ../..
          podman run --rm -v "${{ github.workspace }}:/src" -w /src \
            -e GOTOOLCHAIN=auto -e GOFLAGS=-buildvcs=false \
            -e VERSION=${{ steps.vars.outputs.VERSION }} \
            -e COMMIT=${{ steps.vars.outputs.COMMIT }} \
            -e DATE=${{ steps.vars.outputs.DATE }} \
            -e APP_VERSION=${{ steps.vars.outputs.APP_VERSION }} \
            -e APP_BUILD=${{ github.run_number }} \
            mcc-gui-build:linux sh mcc-gui/package/build.sh linux amd64 package

      - name: Build Core macOS DMG Volumes
        run: |
          cd mcc-gui/package
          podman build -t mcc-gui-build:macos -f macos.Dockerfile .
          cd ../..
          podman run --rm -v "${{ github.workspace }}:/src" -w /src \
            -e GOTOOLCHAIN=auto -e GOFLAGS=-buildvcs=false \
            -e VERSION=${{ steps.vars.outputs.VERSION }} \
            -e COMMIT=${{ steps.vars.outputs.COMMIT }} \
            -e DATE=${{ steps.vars.outputs.DATE }} \
            -e APP_VERSION=${{ steps.vars.outputs.APP_VERSION }} \
            -e APP_BUILD=${{ github.run_number }} \
            mcc-gui-build:macos sh mcc-gui/package/build.sh macos amd64 package

      - name: Generate Consolidated Integrity Checksums
        run: |
          cd dist
          sha256sum * > sha256sums.txt

      - name: Generate Production Release Instance on GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

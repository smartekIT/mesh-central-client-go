name: Compile Fast Release Assets (AMD64 Only)

on:
  push:
    tags:
      - 'v*'
      - '!v*-full' # Prevents this fast workflow from running if you want a full build

permissions:
  contents: write

jobs:
  build-amd64-only:
    name: Compile AMD64 Assets
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Source Assets
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Initialize Native Go Environment
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          cache: true

      - name: Configure Container Engine
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Extract Dynamic Workflow Versions
        id: vars
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          CLEAN_VERSION="${TAG_NAME#v}"
          echo "VERSION=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "APP_VERSION=${CLEAN_VERSION}" >> $GITHUB_OUTPUT
          echo "COMMIT=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

      - name: Build Windows Base Container
        run: |
          cd mcc-gui/package
          podman build -t mcc-gui-build:windows -f windows.Dockerfile .

      - name: Build Linux Base Container
        run: |
          cd mcc-gui/package
          podman build -t mcc-gui-build:linux -f linux.Dockerfile .

      - name: Build Windows AMD64 Installer Packages (MSI & ZIP)
        run: |
          podman run --rm -v "${{ github.workspace }}:/src" -w /src \
            -e GOTOOLCHAIN=auto -e GOFLAGS=-buildvcs=false \
            -e VERSION=${{ steps.vars.outputs.VERSION }} \
            -e COMMIT=${{ steps.vars.outputs.COMMIT }} \
            -e DATE=${{ steps.vars.outputs.DATE }} \
            -e APP_VERSION=${{ steps.vars.outputs.APP_VERSION }} \
            -e APP_BUILD=${{ github.run_number }} \
            mcc-gui-build:windows sh mcc-gui/package/build.sh windows amd64 package

      - name: Build Windows AMD64 Standalone GUI Binary (.EXE)
        run: |
          podman run --rm -v "${{ github.workspace }}:/src" -w /src \
            -e GOTOOLCHAIN=auto -e GOFLAGS=-buildvcs=false \
            -e VERSION=${{ steps.vars.outputs.VERSION }} \
            -e COMMIT=${{ steps.vars.outputs.COMMIT }} \
            -e DATE=${{ steps.vars.outputs.DATE }} \
            -e APP_VERSION=${{ steps.vars.outputs.APP_VERSION }} \
            -e APP_BUILD=${{ github.run_number }} \
            mcc-gui-build:windows sh mcc-gui/package/build.sh windows amd64 build

      - name: Build Linux AMD64 AppImage Package
        run: |
          podman run --rm -v "${{ github.workspace }}:/src" -w /src \
            -e GOTOOLCHAIN=auto -e GOFLAGS=-buildvcs=false \
            -e VERSION=${{ steps.vars.outputs.VERSION }} \
            -e COMMIT=${{ steps.vars.outputs.COMMIT }} \
            -e DATE=${{ steps.vars.outputs.DATE }} \
            -e APP_VERSION=${{ steps.vars.outputs.APP_VERSION }} \
            -e APP_BUILD=${{ github.run_number }} \
            mcc-gui-build:linux sh mcc-gui/package/build.sh linux amd64 package

      - name: Upload Fast AMD64 Assets
        uses: softprops/action-gh-release@v2.0.1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
